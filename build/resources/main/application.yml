eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents,metrics
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

# ── Resilience4j Circuit Breaker / Time-Limiter ───────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        # Percentage of failures that trip the circuit
        failureRateThreshold: 50
        # Slow calls (> 2 s) also count toward the failure rate
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        # Minimum number of calls before the CB can calculate failure rate
        minimumNumberOfCalls: 5
        # How many calls are allowed in HALF_OPEN state before deciding
        permittedNumberOfCallsInHalfOpenState: 3
        # How long to stay OPEN before attempting HALF_OPEN
        waitDurationInOpenState: 10s
        # Slide-window size (COUNT_BASED)
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # Automatically move to HALF_OPEN after waitDurationInOpenState
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Record these exceptions as failures
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        # Ignore these exceptions (don't count as failures)
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      bakongTopUpCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 10s  # Bakong can be slow
      userServiceCB:
        baseConfig: default
      busServiceCB:
        baseConfig: default
      bookingServiceCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 5s
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s  # General requests timeout
        cancelRunningFuture: true
    instances:
      bakongTopUpCB:
        timeoutDuration: 300s  # 5 minutes for Bakong top-up processing
        cancelRunningFuture: false
      userServiceCB:
        baseConfig: default  # 10 seconds for regular user-service requests
      busServiceCB:
        baseConfig: default
      bookingServiceCB:
        timeoutDuration: 300s  # 5 minutes for payment processing (Bakong API)
        cancelRunningFuture: false

logging:
  level:
    root: INFO
    com.busapp.gatewayservice: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    # Suppress Micrometer observation span noise (http.status_code='UNKNOWN' is a
    # known SCG 4.1.x bug — status tag is unset at span-creation time; not a real error)
    org.springframework.cloud.gateway.filter.headers.observation: WARN
    reactor.netty: DEBUG
