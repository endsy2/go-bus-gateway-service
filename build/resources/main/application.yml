server:
  port: 8080

# ── CORS Configuration ─────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://172.19.64.1:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cloud:
    gateway:
      # Automatically create routes for every registered Eureka service:
      # e.g. http://localhost:8080/user-service/** → lb://user-service/**
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # Explicit named routes (preferred for production)
      routes:
        # ── Auth (public — no JWT required) ───────────────────────────────────
        - id: auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Admin — User Service ───────────────────────────────────────────────
        - id: admin-user-service
          uri: lb://user-service
          predicates:
            - Path=/api/admin/users/**,/api/admin/roles/**,/api/admin/permissions/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Bakong Top-Up (needs longer timeout for payment processing) ──────
        - id: bakong-topup-service
          uri: lb://user-service
          predicates:
            - Path=/api/wallets/top-up/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bakongTopUpCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 1
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── User Service ───────────────────────────────────────────────────────
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/wallet/**,/api/wallets/**,/api/notifications/**,/api/topups/**,/api/preferences/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Bus Service ────────────────────────────────────────────────────────
        - id: bus-service
          uri: lb://bus-service
          predicates:
            - Path=/api/buses/**,/api/routes/**,/api/layouts/**,/api/schedules/**,/api/seats/**
          filters:
            - name: CircuitBreaker
              args:
                name: busServiceCB
                fallbackUri: forward:/fallback/bus-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Admin — Booking Service ────────────────────────────────────────────
        - id: admin-booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/admin/bookings/**,/api/admin/reports-operation/**,/api/admin/financial-reports/**,/api/admin/dashboard/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Booking Service ────────────────────────────────────────────────────
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**,/api/payments/**,/api/tickets/**,/api/promos/**,/api/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── WebSocket Routes ────────────────────────────────────────────────
        # IMPORTANT: WebSocket routes must come BEFORE HTTP routes to match correctly
        
        # Bus Service WebSocket - All SockJS endpoints
        - id: bus-websocket
          uri: lb:ws://bus-service
          predicates:
            - Path=/bus-service/ws/bus/**
          filters:
            - RewritePath=/bus-service/ws/bus/(?<segment>.*), /ws/bus/$\{segment}

        # Booking Service WebSocket - All SockJS endpoints
        - id: booking-websocket
          uri: lb:ws://booking-service
          predicates:
            - Path=/booking-service/ws/booking/**
          filters:
            - RewritePath=/booking-service/ws/booking/(?<segment>.*), /ws/booking/$\{segment}

        # Admin Dashboard WebSocket
        - id: admin-dashboard-websocket
          uri: lb:ws://booking-service
          predicates:
            - Path=/admin/ws/dashboard/**
          filters:
            - RewritePath=/admin/ws/dashboard/(?<segment>.*), /ws/booking/$\{segment}


